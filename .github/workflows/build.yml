name: Build

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore IsaacMode.sln

      - name: Build (Release)
        run: dotnet build IsaacMode.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/IsaacMode.Tests/IsaacMode.Tests.csproj -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Install Pillow (icon check in package script)
        run: python3 -m pip install --quiet pillow

      - name: Package for Thunderstore
        run: bash scripts/package.sh

      - name: Upload mod DLL
        uses: actions/upload-artifact@v4
        with:
          name: IsaacMode-dll
          path: src/IsaacMode/bin/Release/net35/IsaacMode.dll
          if-no-files-found: error

      - name: Upload Thunderstore package
        uses: actions/upload-artifact@v4
        with:
          name: IsaacMode-thunderstore
          path: artifacts/*.zip
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/IsaacMode.Tests/TestResults/*.trx

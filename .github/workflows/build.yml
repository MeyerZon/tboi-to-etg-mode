name: Build

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore IsaacMode.sln

      - name: Build (Release)
        run: dotnet build IsaacMode.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/IsaacMode.Tests/IsaacMode.Tests.csproj -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Install Pillow (icon check in package script)
        run: python3 -m pip install --quiet pillow

      - name: Package for Thunderstore
        run: bash scripts/package.sh

      - name: Upload mod DLL
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: IsaacMode-dll
          path: src/IsaacMode/bin/Release/net35/IsaacMode.dll
          if-no-files-found: error

      - name: Upload Thunderstore package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: IsaacMode-thunderstore
          path: artifacts/*.zip
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: tests/IsaacMode.Tests/TestResults/*.trx
